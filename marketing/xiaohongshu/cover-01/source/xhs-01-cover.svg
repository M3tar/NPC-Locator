<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">联机找不到 NPC？我做了一个定位 Mod</title>
  <desc id="desc">NPC Locator 小红书封面，展示秋季联机游戏中的 NPC 追踪栏，并提示左滑查看成品。</desc>

  <defs>
    <clipPath id="shot-clip">
      <rect x="78" y="548" width="924" height="578" rx="12"/>
    </clipPath>
    <pattern id="paper-grain" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1" fill="#4b3423" opacity=".06"/>
      <circle cx="23" cy="18" r=".8" fill="#4b3423" opacity=".05"/>
      <path d="M9 26h6" stroke="#fff8e8" stroke-width="1" opacity=".35"/>
    </pattern>
    <marker id="cta-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#9b5a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1080" height="1440" fill="#f2e7d3"/>
  <rect width="1080" height="1440" fill="url(#paper-grain)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="metadata" transform="translate(78 76)">
      <text x="0" y="0" fill="#756451" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="3">STARDEW VALLEY MOD</text>
      <circle cx="314" cy="-7" r="4" fill="#9b5a2e"/>
      <text x="334" y="0" fill="#756451" font-size="20" font-weight="650" letter-spacing="2">联机工具</text>
      <line x1="0" y1="34" x2="924" y2="34" stroke="#cbbca6" stroke-width="2"/>
    </g>

    <g id="title-block" transform="translate(78 160)">
      <text x="0" y="0" fill="#9b5a2e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" letter-spacing="5">NPC LOCATOR · NPC 定位器</text>
      <text x="0" y="132" fill="#2b2016" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="118" font-weight="500" letter-spacing="4">联机找不到</text>
      <text x="0" y="282" fill="#2b2016" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="150" font-weight="400" letter-spacing="9">NPC？</text>
      <text x="4" y="354" fill="#7b6b59" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="42" font-weight="400">我做了一个定位 Mod</text>
    </g>

    <g id="project-proof">
      <rect x="86" y="558" width="924" height="578" rx="12" fill="#2b2016" opacity=".14"/>
      <rect x="74" y="544" width="932" height="586" rx="15" fill="#d8c7aa" stroke="#b18b60" stroke-width="2"/>
      <image x="78" y="548" width="924" height="578" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)" xlink:href="../assets/tracker-autumn-crop.jpg"/>
    </g>

    <g id="call-to-action" transform="translate(78 1195)">
      <line x1="0" y1="0" x2="924" y2="0" stroke="#9b5a2e" stroke-width="3"/>
      <text x="0" y="70" fill="#2b2016" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="48" font-weight="500" letter-spacing="2">左滑看成品</text>
      <path d="M820 54H920" fill="none" stroke="#9b5a2e" stroke-width="4" marker-end="url(#cta-arrow)"/>
      <text x="0" y="116" fill="#7b6b59" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" letter-spacing="3">位置 · 下一站 · 方向 · 距离</text>
    </g>

    <g id="footer" transform="translate(78 1380)">
      <line x1="0" y1="-34" x2="924" y2="-34" stroke="#cbbca6" stroke-width="2"/>
      <text x="0" y="0" fill="#756451" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="4">NEXUS MODS</text>
      <text x="924" y="0" text-anchor="end" fill="#756451" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="4">50217</text>
    </g>
  </g>
</svg>
