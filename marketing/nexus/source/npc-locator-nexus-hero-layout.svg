<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1300" height="372" viewBox="0 0 1300 372"
     role="img" aria-labelledby="title desc">
  <title id="title">NPC Locator for Stardew Valley</title>
  <desc id="desc">A Nexus Mods header combining the NPC Locator title and features with a real multiplayer gameplay capture showing the tracker overlay.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1511"/>
      <stop offset="0.64" stop-color="#382319"/>
      <stop offset="1" stop-color="#211612"/>
    </linearGradient>
    <linearGradient id="photo-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1b15" stop-opacity="0.48"/>
      <stop offset="0.25" stop-color="#2a1b15" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2a1b15" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8d6544" stroke-width="1" opacity="0.14"/>
    </pattern>
    <clipPath id="photo-clip">
      <rect x="714" y="20" width="562" height="332" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1300" height="372" fill="url(#background)"/>
  <rect x="12" y="12" width="1276" height="348" rx="26" fill="url(#grid)" stroke="#8d6544" stroke-width="2"/>

  <g id="title-block" transform="translate(58 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="eyebrow" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="750" letter-spacing="2">
      <circle cx="8" cy="0" r="6" fill="#dfa03c"/>
      <text x="26" y="6" fill="#e4aa52">STARDEW VALLEY 1.6 · SMAPI MOD</text>
    </g>

    <text x="0" y="91" fill="#fff3d3" font-size="68" font-weight="820" letter-spacing="-2.5">NPC Locator</text>
    <text x="2" y="139" fill="#ead2aa" font-size="28" font-weight="540">Find villagers. See the next stop.</text>
    <text x="2" y="176" fill="#c9aa82" font-size="24">Keep moving in solo and multiplayer.</text>

    <g id="feature-chips" transform="translate(0 215)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="750" letter-spacing="0.5">
      <g>
        <rect width="166" height="38" rx="9" fill="#f0d29b"/>
        <circle cx="20" cy="19" r="6" fill="#68834d"/>
        <text x="36" y="25" fill="#3b281d">LIVE LOCATION</text>
      </g>
      <g transform="translate(178 0)">
        <rect width="128" height="38" rx="9" fill="#f0d29b"/>
        <path d="M19 10L22 16L29 17L24 22L25 29L19 26L13 29L14 22L9 17L16 16Z" fill="#bd6a35"/>
        <text x="36" y="25" fill="#3b281d">NEXT STOP</text>
      </g>
      <g transform="translate(318 0)">
        <rect width="245" height="38" rx="9" fill="#f0d29b"/>
        <path d="M12 25L27 10M18 10H27V19" fill="none" stroke="#68834d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="25" fill="#3b281d">DIRECTION + DISTANCE</text>
      </g>
    </g>

    <g id="route-motif" transform="translate(2 285)">
      <path d="M0 0H520" fill="none" stroke="#a95d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 11" opacity="0.8"/>
      <circle cx="0" cy="0" r="9" fill="#68834d" stroke="#b9cf93" stroke-width="3"/>
      <circle cx="520" cy="0" r="9" fill="#dfa03c" stroke="#f4d18c" stroke-width="3"/>
    </g>
  </g>

  <g id="gameplay-proof" clip-path="url(#photo-clip)">
    <image x="714" y="20" width="562" height="332"
           preserveAspectRatio="xMidYMid slice"
           xlink:href="multiplayer-tracker-crop.jpg"/>
    <rect x="714" y="20" width="562" height="332" fill="url(#photo-shade)"/>

    <g transform="translate(1030 301)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="224" height="32" rx="9" fill="#281a14" fill-opacity="0.9" stroke="#e0a24b" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="5" fill="#6f8b50"/>
      <text x="32" y="21" fill="#fff0cd" font-size="13" font-weight="750" letter-spacing="0.8">REAL MULTIPLAYER TEST</text>
    </g>
  </g>

  <rect x="714" y="20" width="562" height="332" rx="22" fill="none" stroke="#d49246" stroke-width="3"/>
</svg>
